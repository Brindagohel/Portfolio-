<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

     <link rel="stylesheet" href="style.css"/>

     <style>
        body {background:#0e0e0e; overflow-x : hidden;}

        .hero-section{
            min-height: 92vh;
            display: flex;
            align-items: center;
            padding: 60px 0 40px;
            position:relative;
            overflow:hidden;
        }

        .hero-section::before{
            content: '';
            position:absolute;
            top: -120px; left: -120px;
            width:500px; height: 500px;
            background: radial-gradient(circle, rgba(201,168,76,0.07)0%, transparent 70%);
            pointer-events: none;

        }

        .hero-section::after{
            content: '';
            position:absolute;
            bottom: -80px ; right:-80px;
            width: 400px ; height: 400px;
            background: radial-gradient(circle, rgba(201,168,76,0.05)0%, transparent 70%);
            pointer-events: none;
        }

        .photo-wrapper{
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .photo-ring{
            position: relative;
            width: 320px;
            height: 320px;

        }

        .photo-ring::before{
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px dashed rgba(201,168,76,0.4);
            animation: spin 18s linear infinite;
        }

        .photo-ring::after{
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(135deg,#c9a84c,#e8c97a,#c9a84c)border-box;
            -webkit-mask: linear-gradient(#fff 0 0 ) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;

        }

        @keyframes spin {to {transform: rotate(360deg);}}

        .photo-ring-img{
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            display:block;
            background: #1c1c1c;
        }

        .photo-placeholder{
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg ,#1c1c1c ,#2a2a2a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--gold , #c9a84c);

        }

        .photo-placeholder i {font-size: 5rem; opacity: 0.5;}
        .photo-placeholder p {font-size: 0.75rem; color: #5a5450; margin-top: 8px ;}


       .hero-text{ padding-left: 20px;}

       .hero-greeting{
        font-size: 1rem;
        color: #8a8278;
        font-weight: 400;
        letter-spacing:1px;
        text-transform: uppercase;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap:10px;
       }

       .hero-greeting::before{
        content: '';
        display: inline-block;
        width: 30px; height: 1.5px;
        background: linear-gradient(135deg,#c9a84c,#e8c97a);
       }

       .hero-name{
        font-family: 'Times New Roman', Times, serif;
        font-size: 3.2rem;
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 12px;
        color: #f0ece4;
       }

       .hero-name span{
        background: linear-gradient(135deg,#c9a84c, #e8c97a);
        -webkit-background-clip : text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
       }

       .hero-role{
        font-size: 1.15rem;
        color: #c8c0b4;
        margin-bottom: 16px;
        font-weight: 400;
       }

       .hero-role.typed-text{
        color: var(--gold, #c9a84c);
        font-weight: 600;
        border-right: 2px solid  var(--gold, #c9a84c) ;
        padding-right: 3px;
        animation: blink 0.8s step-end infinite;
    }

    @keyframes blink{50% {border-color: transparent;}}

    .hero-desc{
        font-size: 0.95rem;
        color: #8a8278;
        line-height: 1.8;
        margin-bottom: 28px;
        max-width: 500px;
    }
    .hero-stats{
        display: flex;
        gap: 28px;
        margin-bottom: 32px;

    }

    .stats-item{text-align: center;}
    .stats-num{
        font-family: 'Times New Roman', Times, serif;
        font-size: 1.6rem;
        font-weight: 700;
        background: linear-gradient(135deg,#c9a84c,#e8c97a);
        -webkit-background-clip : text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: block;
    }
    .stat-label{font-size: 0.7rem;color: #5a545a; text-transform: lowercase; letter-spacing: 0.5px; }

    .hero-btns{display: flex; gap: 14px; flex-wrap:wrap; margin-bottom: 32px;}

    .hero-socials{display: flex; gap: 10px;}

    @media (max-width: 768px){
        .hero-text{padding-left: 0; margin-top: 40px; text-align:center}
        .photo-ring{width: 220px; height: 220px;}
        .hero-stats{justify-content: center;}
        .hero-btns{justify-content: center;}
        .hero-socials{justify-content: center;}
        .hero-greeting{justify-content: center;}

    }

    @keyframes fadeUp {to {opacity: 1; transform: none;}}

    .fade-up{
        opacity: 0;
        transform: translateY(30px);
        animation: fadeUp 0.8s ease forwards;
    }

    .delay-1 {animation-delay: 0.1s;}
    .delay-2 {animation-delay: 0.2s;}
    .delay-3 {animation-delay: 0.35s;}
    .delay-4 {animation-delay: 0.5s;}
    .delay-5 {animation-delay: 0.65s;}
</style>
</head>
<body> 
<main>
    <section class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-5 col-md-6 d-flex justify-content-center fade-up">
                    <div class="photo-wrapper">
                        <div class="photo-ring">
                            <img src="img/img1.png" alt="Brinda Gohel"  class="photo-ring-img " onerror="this.style.display='flex'; this.nextElementSibling.style.display='block'; "/> 
                            <div class="photo-placeholder" style="display:none">
                                <i class="bi bi-person-circle"></i>
                                <p>Add img/img1.jpeg</p>
                            </div>
                        </div>
                     
                    </div>
                </div>
                <div class="col-lg-7 col-md-6">
                    <div class="hero-text">
                        <p class="hero-greeting fade-up delay-1">Hello, Welcome</p>
                        <h1 class="hero-name fade-up delay-2">
                           I'm <span>Brinda</span><br> Gohel
                        </h1>
                        <p class="hero-role fade-up delay-3">
                            I'm <span class="typed-text" id="typeRole">Full Stack Developer</span>
                        </p>

                        <p class="hero-desc fade-up delay-3">
                            Aspiring Full Stack Developer
                        </p>

                        <div class="hero-stats fade-up delay-4">
                            <div class="stats-item">
                                <span class="stat-num">3+ </span>
                                <span class="stat-label">Internships</span>
                            </div>

                            <div class="stat-item">
                                <span class="stat-num">5+</span>
                                <span class="stat-label">Certifications</span>
                            </div>
                        </div>
                        <div class="hero-btns fade-up delay-4">
                            <a href="Contact.html" target="pageFrame" class="btn-gold">
                                <i class="bi bi-envelope me-2"></i>
                                Contect ME
                            </a>
                            <a href="img/resume.pdf" download class="btn-outline-gold">
                                <i class="bi bi-download me-2"></i>
                                Download resume
                            </a>
                        </div>

                        <div class="hero-socials fade-up delay-5">
                            <a href="https://github.com/brindagohel" target="_blank" class="social-icon" title="GitHub">
                                <i class="bi bi-github"></i>
                            </a>
                            <a href="https://linkedin.com/in/brinda-gohel" target="_blank" class="social-icon" title="Linkedin">
                                <i class="bi bi-linkedin"></i>
                            </a>
                            <a href="mailto: brindagohel92@gmail.com"  class="social-icon" title="Email">
                                <i class="bi bi-envelope"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

            
    </section>
</main>
    
</body>
</html>
