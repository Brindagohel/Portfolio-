<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brinda Gohel | portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

    <link rel="stylesheet" href="style.css">
    <style>
       html,body{
        margin:0;
        padding: 0;
        height: 100%;
        overflow:hidden;
       }

       body{
        display: flex;
        flex-direction: column;
        background: #0e0e0e;
       }
        .main-nav{
            position: sticky;
            top: 0;
            z-index: 999;
            background: rgba(14,14,14,0.96);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(201,168,76,0.18);
            padding: 14px 0;
        }

        .navbar-brand{
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(135deg,#c9a84c,#e8c97a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .nav-links{
            display: flex; gap: 4px; list-style:none; margin:0; padding:0;
        }

        .nav-links .nav-link{
            color: #8a8278 !important;
            font-size: 0.88rem;
            font-weight: 500;
            padding:6px 14px !important;
            border-radius: 50px;
            transition: all 0.25s;
            position:relative;  
        }
        .nav-links .nav-link:hover,
        .nav-links .nav-link.active{
            color: var(--gold-light, #e8c97a)!important;
            background: rgba(201,168,76,0.08);

        }
        .navbar-toggle{border:1px solid rgba(201,168,76,0.3);}
        .navbar-toggler-icon{filter: invert(0.8) sepia(1) saturate(3) hue-rotate(5deg);}

        #pageFrame{
            display: block;
            width: 100%;
            border: none;
            flex:1;
            height: calc(100vh - 140px);
            background: #0e0e0e;
            
           
        }

        .main-footer{
            background: #111111;
            border-top:  1px solid rgba(201,168,76,0.15);
            padding: 22px 0;
            text-align: center;
            color: #5a5450;
            font-size: 0.85rem;
        }

        .main-footer .ft-name{
            background: linear-gradient(135deg,#c9a84c,#e8c97a);
            -webkit-background-clip:  text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;

        }
    </style>
</head>
<body>
       
        <nav class="main-nav navbar navbar-expand-lg ">
            <div class="container">
                <a class="navbar-brand" href="#">Brinda</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggle-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
                    <ul class="nav-links navbar-nav">
                        <li class="nav-item">
                        <a class="nav-link active"  href="Home.html" target="pageFrame" onclick="setActive(this)">
                            <i class="bi bi-house-door me-1"></i>Home</a>
                        </li>

                        <li class="nav-item">
                        <a class="nav-link "  href="About.html" target="pageFrame" onclick="setActive(this)">
                            <i class="bi bi-person me-1"></i>About</a>
                        </li>

                        <li class="nav-item">
                        <a class="nav-link "  href="Skills.html" target="pageFrame" onclick="setActive(this)">
                            <i class="bi bi-code-slash me-1"></i>Skills</a>
                        </li>

                        <li class="nav-item">
                        <a class="nav-link "  href="Contact.html" target="pageFrame" onclick="setActive(this)">
                            <i class="bi bi-envelope me-1"></i>Contact Me</a>
                        </li> 
                    </ul>
                </div>
     
            </div>
      </nav>
    


 <iframe 
    src="Home.html" 
    name="pageFrame" 
    id="pageFrame"
    frameborder="0"
    scrolling="auto">
  </iframe>

  <footer class="main-footer">
    <p>@ 2026 &nbsp;<span class="ft-name">Brinda Gohel</span>&nbsp; All rights reserved</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  
</body>
</html>
